<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Drive Copier</title>

  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;

  </style>
</head>

<body>

<div class="container">

  <h1>📁 Drive Copier</h1>

  <div class="subtitle">
    Copy folder Google Drive tanpa perlu memasukkan Folder ID.
  </div>

  <label>Source Folder</label>

  <input
    id="source"
    type="text"
    placeholder="Paste link folder Google Drive..."
  >

  <label>Destination Folder</label>

  <input
    id="destination"
    type="text"
    placeholder="Paste link folder tujuan..."
  >

  <button id="copyButton" onclick="startCopy()">
    COPY FOLDER
  </button>

  <div class="status" id="status">
    Siap digunakan.
  </div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="stats">

    <div class="stat">
      <strong id="copied">0</strong>
      <span>Copied</span>
    </div>

    <div class="stat">
      <strong id="skipped">0</strong>
      <span>Skipped</span>
    </div>

    <div class="stat">
      <strong id="folders">0</strong>
      <span>Folders</span>
    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbxsh0K4u-GyNwqHEX7RmEpz_p7LIdd7nbORfm0pykgrpxN8U2FpJt_hw_t11_pLpZ7w/exec";


let jobId = null;


/* =========================
   START COPY
========================= */

async function startCopy() {

  const source =
    document.getElementById("source").value.trim();

  const destination =
    document.getElementById("destination").value.trim();

  if (!source || !destination) {

    setStatus(
      "Source dan Destination wajib diisi.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("copyButton");

  button.disabled = true;
  button.textContent = "MEMULAI...";


  setStatus("Memulai proses copy...");


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({
        action: "start",
        source: source,
        destination: destination
      })

    });


    const result = await response.json();

    if (!result.ok) {

      throw new Error(
        result.error || "Terjadi kesalahan."
      );

    }


    jobId = result.data.id;

    updateStats(result.data);

    setStatus("Proses copy berjalan...");

    await continueCopy();


  } catch (error) {

    setStatus(
      "ERROR: " + error.message,
      "error"
    );

    button.disabled = false;
    button.textContent = "COPY FOLDER";

  }

}


/* =========================
   CONTINUE
========================= */

async function continueCopy() {

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({
        action: "continue",
        jobId: jobId
      })

    });


    const result = await response.json();

    if (!result.ok) {

      throw new Error(
        result.error || "Terjadi kesalahan."
      );

    }


    const job = result.data;

    updateStats(job);


    if (job.status === "completed") {

      setStatus(
        "✅ COPY SELESAI!",
        "success"
      );

      document.getElementById("progress").style.width =
        "100%";

      const button =
        document.getElementById("copyButton");

      button.disabled = false;
      button.textContent = "COPY LAGI";

      return;
    }


    setStatus(
      "Copy masih berjalan... Folder tersisa: " +
      job.queue.length
    );


    // Lanjut otomatis setelah 1 detik
    setTimeout(
      continueCopy,
      1000
    );


  } catch (error) {

    setStatus(
      "ERROR: " + error.message,
      "error"
    );

    const button =
      document.getElementById("copyButton");

    button.disabled = false;
    button.textContent = "COBA LAGI";

  }

}


/* =========================
   UPDATE STATS
========================= */

function updateStats(job) {

  document.getElementById("copied").textContent =
    job.copied || 0;

  document.getElementById("skipped").textContent =
    job.skipped || 0;

  document.getElementById("folders").textContent =
    job.foldersCreated || 0;


  /*
   * Progress ini hanya perkiraan.
   * Backend akan tetap melanjutkan sampai selesai.
   */

  const processed =
    (job.copied || 0) +
    (job.skipped || 0);

  const remaining =
    job.queue.length || 0;

  const total =
    processed + remaining;

  let percentage = 0;

  if (total > 0) {
    percentage =
      Math.min(
        99,
        Math.round(
          processed / total * 100
        )
      );
  }


  document.getElementById("progress").style.width =
    percentage + "%";

}


/* =========================
   STATUS
========================= */

function setStatus(text, type = "") {

  const status =
    document.getElementById("status");

  status.textContent = text;

  status.className =
    "status " + type;

}

</script>

</body>
</html>
